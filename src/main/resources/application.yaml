spring:
  application:
    name: notify
  config:
    import: optional:file:.env[.properties]
  rabbitmq:
    # Lista de nodos del clúster: si el primero no responde, Spring se conecta al siguiente.
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # Grupo propio: notify recibe todos los eventos, independiente de audit y report.
      group-id: ms-rutaexpress-notify
      # Un grupo nuevo parte desde los mensajes nuevos: no se reenvían correos de eventos antiguos.
      auto-offset-reset: latest
      enable-auto-commit: false
      # ErrorHandlingDeserializer envuelve al deserializador real: si un mensaje no se puede leer,
      # no bloquea la partición y el error handler lo manda a notify.DLT.
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
    # Productor usado solo para publicar en notify.DLT.
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
    listener:
      # Confirma el offset de cada mensaje apenas termina (o apenas llega a notify.DLT).
      ack-mode: record

# Contrato de topología RabbitMQ (mismos nombres y estructura en todos los microservicios).
rutaexpress:
  rabbitmq:
    exchanges:
      direct: cmd.direct
      topic: cmd.topic
      dead-letter: cmd.dead.dlx
    email:
      queue: q.cmd.email
      routing-key: email.send
      pattern: email.*
      dlq: q.cmd.email.dlq
      retry-queue: q.cmd.email.retry
    warehouse:
      queue: q.cmd.warehouse
      routing-key: warehouse.ticket
      pattern: warehouse.#
      dlq: q.cmd.warehouse.dlq
      retry-queue: q.cmd.warehouse.retry
    label:
      queue: q.cmd.label
      routing-key: label.gen
      pattern: label.*
      dlq: q.cmd.label.dlq
      retry-queue: q.cmd.label.retry
    audit:
      dead-letter-queue: q.audit.deadletter
    retry:
      max-attempts: ${RETRY_MAX_ATTEMPTS:3}
      delay-ms: ${RETRY_DELAY_MS:5000}
  kafka:
    shipment-events-topic: shipments.events
    dlt-topic: notify.DLT
    concurrency: 3
    # Estados de ShipmentStatusChanged que generan el comando de email hacia RabbitMQ.
    email-states: ${NOTIFY_EMAIL_STATES:EN_RUTA,ENTREGADO,CANCELADO}

tickets:
  dir: ${TICKETS_DIR:./data/tickets}

labels:
  dir: ${LABELS_DIR:./data/labels}
